<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="172" height="100" viewBox="-8 -12.5 102 75" fill="none">
  <defs>
    <linearGradient id="ej-grad" x1="42.3" y1="0" x2="43.7" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e16fc"/>
      <stop offset="1" stop-color="#07e4cd"/>
    </linearGradient>

    <!-- Відблиск, що пробігає по логотипу -->
    <linearGradient id="ej-shine" x1="-30" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="0 0; 0 0; 150 0" keyTimes="0; 0.55; 1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="ej-glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <path id="ej-left" pathLength="1" d="M33.2 50 L27.5 50 L0 25.6 L27.2 1.4 L39.8 1.3 L12.4 25.6 L18.5 30.9 L30.2 20.4 L36 25.1 L36.6 25.6 L36 26.1 L24.7 36.3 L30.4 41.8 L53.6 20.8 L54.4 20.8 L60.4 25.5 Z"/>
    <path id="ej-right" pathLength="1" d="M58.5 0 L85.3 24.2 L58.2 48.4 L46.3 48.5 L73.3 24.2 L55.6 8.3 L43.6 19.2 L37.2 13.8 L52.5 0 Z"/>
  </defs>

  <style>
    .ej { transform-origin: 43px 25px; animation: ej-lock .5s cubic-bezier(.3, 1.6, .5, 1) 1.5s both; }

    .ej-l { animation: ej-in-l 1.2s cubic-bezier(.2, .8, .2, 1) both; }
    .ej-r { animation: ej-in-r 1.2s cubic-bezier(.2, .8, .2, 1) both; }

    .ej-line {
      fill: none; stroke: url(#ej-grad); stroke-width: .8; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: ej-draw 1.1s ease-in-out .1s forwards, ej-fade .4s ease 1.2s forwards;
    }
    .ej-fill { fill: url(#ej-grad); opacity: 0; animation: ej-show .5s ease 1s forwards; }
    .ej-glow { fill: url(#ej-grad); filter: url(#ej-glow); opacity: 0;
      animation: ej-show .5s ease 1.2s forwards, ej-pulse 2.4s ease-in-out 1.7s infinite; }
    .ej-shine { fill: url(#ej-shine); opacity: 0; animation: ej-show .1s 1.6s forwards; }

    @keyframes ej-in-l { from { transform: translateX(-14px); opacity: 0; } 30% { opacity: 1; } }
    @keyframes ej-in-r { from { transform: translateX(14px); opacity: 0; } 30% { opacity: 1; } }
    @keyframes ej-draw { to { stroke-dashoffset: 0; } }
    @keyframes ej-fade { to { opacity: 0; } }
    @keyframes ej-show { to { opacity: 1; } }
    @keyframes ej-lock { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }
    @keyframes ej-pulse { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }

    @media (prefers-reduced-motion: reduce) {
      .ej, .ej-l, .ej-r, .ej-line, .ej-fill, .ej-glow, .ej-shine { animation: none; }
      .ej-fill, .ej-shine { opacity: 1; }
      .ej-glow { opacity: .5; }
      .ej-line { display: none; }
    }
  </style>

  <g class="ej">
    <g class="ej-l">
      <use href="#ej-left" xlink:href="#ej-left" class="ej-glow"/>
      <use href="#ej-left" xlink:href="#ej-left" class="ej-fill"/>
      <use href="#ej-left" xlink:href="#ej-left" class="ej-shine"/>
      <use href="#ej-left" xlink:href="#ej-left" class="ej-line"/>
    </g>
    <g class="ej-r">
      <use href="#ej-right" xlink:href="#ej-right" class="ej-glow"/>
      <use href="#ej-right" xlink:href="#ej-right" class="ej-fill"/>
      <use href="#ej-right" xlink:href="#ej-right" class="ej-shine"/>
      <use href="#ej-right" xlink:href="#ej-right" class="ej-line"/>
    </g>
  </g>
</svg>
